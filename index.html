<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Raj Industries — Iron &amp; Metal Fabrication, Sikar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;500;600;700&family=Libre+Baskerville:ital@1&display=swap');

:root {
  --bg: #0E0F11; --bg2: #0A0B0C; --card: #17181B; --border: rgba(255,255,255,0.09);
  --ember: #E8792B; --brass: #D9A85C; --steel: #6B7280;
}
html { scroll-behavior: smooth; }
body { margin:0; background: var(--bg); }
.raj-root { background: var(--bg); color: #F2F2F2; font-family: 'Source Sans 3', sans-serif; -webkit-font-smoothing: antialiased; position: relative; }
.raj-root .font-display { font-family: 'Bebas Neue', sans-serif; }
.raj-root .font-quote { font-family: 'Libre Baskerville', serif; }

.page-transition { opacity: 0; transform: translateY(10px); transition: opacity 0.45s ease, transform 0.45s ease; }
.page-transition-in { opacity: 1; transform: translateY(0); }

.section-pad { padding-top: clamp(56px, 8vw, 110px); padding-bottom: clamp(56px, 8vw, 110px); }
.section-pad-sm { padding-top: clamp(48px, 6vw, 80px); padding-bottom: clamp(32px, 4vw, 56px); }
.section-tint { background: var(--bg2); }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ember); }
.eyebrow-light { display: inline-flex; align-items: center; gap: 10px; font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--brass); opacity: 0; transform: translateY(10px); transition: opacity 0.7s ease, transform 0.7s ease; }
.eyebrow-in { opacity: 1; transform: translateY(0); }

/* ---- Top contact bar ---- */
.topbar { background: linear-gradient(90deg, var(--ember) 0%, var(--brass) 100%); color: #fff; }
.topbar-link { display: inline-flex; align-items: center; gap: 6px; color: #fff; opacity: 0.95; transition: opacity 0.2s ease; }
.topbar-link:hover { opacity: 1; text-decoration: underline; }

/* ---- Nav ---- */
.nav-shell { background: rgba(14,15,17,0.0); transition: background 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease; border-bottom: 1px solid transparent; }
.nav-shell-scrolled { background: rgba(14,15,17,0.94); box-shadow: 0 4px 24px rgba(0,0,0,0.35); border-bottom-color: var(--border); }
.nav-link::after { content:''; position:absolute; left:0; bottom:-6px; height:2px; width:0%; background: var(--ember); transition: width 0.3s ease; border-radius:2px; }
.nav-link:hover::after, .nav-link-active::after { width:100%; }

.nav-dropdown { position:absolute; top:calc(100% + 16px); left:50%; transform: translateX(-50%) translateY(-6px); min-width:220px; background: var(--card); border:1px solid var(--border); border-radius:8px; box-shadow: 0 28px 54px -18px rgba(0,0,0,0.55); padding:8px; opacity:0; pointer-events:none; transition: opacity 0.25s ease, transform 0.25s ease; z-index:40; }
.nav-dropdown-open { opacity:1; transform: translateX(-50%) translateY(0); pointer-events:auto; }
.nav-dropdown-item { display:block; width:100%; text-align:left; font-size:13.5px; color:#C6CBD1; padding:10px 14px; border-radius:5px; transition: background 0.2s ease, color 0.2s ease; }
.nav-dropdown-item:hover { background: rgba(255,255,255,0.06); color:#fff; }

.mobile-menu { position:fixed; inset:0; z-index:60; background: var(--bg); transform: translateX(100%); transition: transform 0.45s cubic-bezier(0.65,0,0.35,1); }
.mobile-menu-open { transform: translateX(0%); }
.mobile-link { opacity:0; transform: translateY(14px); transition: opacity 0.4s ease, transform 0.4s ease; }
.mobile-menu-open .mobile-link { opacity:1; transform: translateY(0); }
.mobile-submenu { max-height:0; overflow:hidden; transition: max-height 0.35s ease; padding-left:4px; }
.mobile-submenu-open { max-height:300px; }

/* ---- CTAs ---- */
.cta-pill { display:inline-flex; align-items:center; gap:8px; background: linear-gradient(90deg, var(--ember), var(--brass)); color:#141414; font-weight:700; padding:13px 24px; border-radius:999px; letter-spacing:0.02em; transition: box-shadow 0.3s ease, transform 0.2s ease, filter 0.3s ease; white-space:nowrap; box-shadow: 0 10px 26px -8px rgba(232,121,43,0.55); }
.cta-pill:hover { filter: brightness(1.08); box-shadow: 0 14px 32px -8px rgba(232,121,43,0.65); }
.cta-pill:active { transform: scale(0.97); }
.cta-ghost { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--border); background: var(--card); color:#fff; padding:13px 22px; border-radius:999px; letter-spacing:0.02em; transition: border-color 0.3s ease, color 0.3s ease; white-space:nowrap; }
.cta-ghost:hover { border-color: var(--brass); color: var(--brass); }
.cta-ghost-light { display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.05); color:#fff; padding:13px 22px; border-radius:999px; letter-spacing:0.02em; transition: border-color 0.3s ease, background 0.3s ease; white-space:nowrap; backdrop-filter: blur(4px); }
.cta-ghost-light:hover { border-color:#fff; background: rgba(255,255,255,0.12); }
.magnetic { display:inline-block; transition: transform 0.25s cubic-bezier(0.33,1,0.68,1); }

.reveal { opacity:0; transform: translateY(24px); transition: opacity 0.7s cubic-bezier(0.25,0.46,0.45,0.94), transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94); }
.reveal-in { opacity:1; transform: translateY(0); }

/* ---- Photo cards (real images) ---- */
.photo-card { position:relative; overflow:hidden; border-radius:8px; border:1px solid var(--border); box-shadow: 0 20px 45px -25px rgba(0,0,0,0.6); opacity:0; transform: translateY(16px) scale(0.98); transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1); background: var(--card); }
.photo-card-in { opacity:1; transform: translateY(0) scale(1); }
.photo-card img { transition: transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94); }
.photo-card:hover img { transform: scale(1.06); }
.photo-sheen { position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.35) 100%); pointer-events:none; }

.shadow-soft { box-shadow: 0 20px 45px -25px rgba(0,0,0,0.6); }

/* ---- Video hero ---- */
.hero-video-wrap { position:relative; min-height: 100svh; overflow:hidden; background: #050506; }
.hero-video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform: scale(1.08); transition: transform 0.6s ease-out; }
.hero-overlay { position:absolute; inset:0; background: linear-gradient(180deg, rgba(6,7,8,0.6) 0%, rgba(6,7,8,0.55) 35%, rgba(6,7,8,0.92) 100%); }
.hero-overlay-grad { position:absolute; inset:0; background: radial-gradient(120% 70% at 15% 0%, rgba(232,121,43,0.22), transparent 55%); }
.hero-line { display:block; overflow:hidden; }
.hero-word, .hero-word-in { display:inline-block; transform: translateY(115%); transition: transform 0.95s cubic-bezier(0.16,1,0.3,1); }
.hero-word-in { transform: translateY(0%); }
.hero-fade { opacity:0; transform: translateY(16px); transition: opacity 0.8s ease, transform 0.8s ease; }
.hero-fade-in { opacity:1; transform: translateY(0); }
.hero-scroll-cue { position:absolute; bottom:28px; left:50%; transform: translateX(-50%); }
.hero-scroll-cue span { display:block; width:1px; height:40px; background: linear-gradient(180deg, var(--brass), transparent); animation: scrollcue 2.2s ease-in-out infinite; }
@keyframes scrollcue { 0%,100% { opacity:0.3; } 50% { opacity:1; } }

/* ---- Product tiles ---- */
.product-tile { }

/* ---- Stats ---- */
.stat-card { background: var(--card); border:1px solid var(--border); border-radius:10px; padding:26px 22px; text-align:center; transition: transform 0.3s ease, border-color 0.3s ease; }
.stat-card:hover { transform: translateY(-4px); border-color: var(--brass); }
.stat-card svg { margin-left:auto; margin-right:auto; }

.process-row { display:flex; align-items:flex-start; gap:20px; padding:20px 4px; border-bottom:1px solid var(--border); opacity:0.5; transition: opacity 0.4s ease; cursor:pointer; }
.process-row-active { opacity:1; }
.process-n { font-size:15px; color: var(--brass); letter-spacing:0.05em; min-width:34px; padding-top:2px; }
.process-visual { min-height:260px; }
.process-frame { position:absolute; inset:0; opacity:0; transition: opacity 0.5s ease; }
.process-frame-active { position:relative; opacity:1; }
.process-frame:first-child { position:relative; }

.why-card { background: var(--card); border:1px solid var(--border); border-radius:10px; padding:30px 26px; transition: transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94), border-color 0.35s ease; }
.why-card:hover { transform: translateY(-4px); border-color: var(--brass); }

.cta-band { background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%); }

.form-field { display:flex; flex-direction:column; gap:7px; }
.form-field span { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#9CA3AF; }
.form-field input, .form-field textarea { background: var(--bg2); border:1px solid var(--border); border-radius:6px; padding:12px 14px; color:#fff; font-family:inherit; font-size:14.5px; transition: border-color 0.25s ease; }
.form-field input::placeholder, .form-field textarea::placeholder { color:#6B7280; }
.form-field input:focus, .form-field textarea:focus { outline:none; border-color: var(--ember); }

.footer-heading { font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#8A93A0; margin-bottom:16px; }
.footer-link { font-size:13.5px; color:#B7BCC3; transition: color 0.25s ease; }
.footer-link:hover { color:#fff; }

.raj-root a:focus-visible, .raj-root button:focus-visible, .raj-root input:focus-visible, .raj-root textarea:focus-visible { outline:2px solid var(--ember); outline-offset:2px; }

@media (max-width: 480px) { .xs\:inline { display:none; } }

@media (prefers-reduced-motion: reduce) {
  .raj-root * { animation:none !important; transition-duration:0.01ms !important; }
  .hero-word, .photo-card, .page-transition { transform:none !important; opacity:1 !important; }
  .hero-video { transform: scale(1) !important; }
}

</style>
</head>

const prefersReducedMotion = () =>
  typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* -------------------------------------------------------------------------
   ROUTER
   ------------------------------------------------------------------------- */
const RouteContext = createContext({ page: "home", navigate: () => {} });
const useRoute = () => useContext(RouteContext);
const VALID_PAGES = ["home", "about", "products", "craftsmanship", "gallery", "contact"];

function parseHash() {
  const raw = (typeof window !== "undefined" ? window.location.hash : "").replace(/^#\/?/, "");
  const [page, anchor] = raw.split("#");
  return { page: VALID_PAGES.includes(page) ? page : "home", anchor: anchor || null };
}

function RouterProvider({ children }) {
  const [route, setRoute] = useState(() => (typeof window !== "undefined" ? parseHash() : { page: "home", anchor: null }));
  useEffect(() => {
    const onHash = () => setRoute(parseHash());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  useEffect(() => {
    if (route.anchor) {
      const t = setTimeout(() => {
        const el = document.getElementById(route.anchor);
        if (el) el.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "start" });
      }, 60);
      return () => clearTimeout(t);
    } else window.scrollTo({ top: 0, behavior: "auto" });
  }, [route.page, route.anchor]);

  const navigate = useCallback((page, anchor) => {
    const target = `#/${page}${anchor ? "#" + anchor : ""}`;
    if (window.location.hash === target) {
      setRoute({ page, anchor });
      if (anchor) { const el = document.getElementById(anchor); if (el) el.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "start" }); }
      else window.scrollTo({ top: 0, behavior: "auto" });
    } else window.location.hash = target;
  }, []);

  return <RouteContext.Provider value={{ page: route.page, anchor: route.anchor, navigate }}>{children}</RouteContext.Provider>;
}

/* -------------------------------------------------------------------------
   MOTION UTILITIES
   ------------------------------------------------------------------------- */
function useReveal(options = {}) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    if (prefersReducedMotion()) { setVisible(true); return; }
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) { setVisible(true); io.unobserve(el); } }, { threshold: 0.15, rootMargin: "0px 0px -8% 0px", ...options });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return [ref, visible];
}

function Reveal({ as: Tag = "div", delay = 0, className = "", children, ...rest }) {
  const [ref, visible] = useReveal();
  return <Tag ref={ref} className={`reveal ${visible ? "reveal-in" : ""} ${className}`} style={{ transitionDelay: visible ? `${delay}ms` : "0ms" }} {...rest}>{children}</Tag>;
}

function Magnetic({ children, strength = 16, className = "", ...rest }) {
  const ref = useRef(null);
  const handleMove = useCallback((e) => {
    if (prefersReducedMotion() || (window.matchMedia && window.matchMedia("(pointer: coarse)").matches)) return;
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.transform = `translate(${((e.clientX - r.left - r.width / 2) / r.width) * strength}px, ${((e.clientY - r.top - r.height / 2) / r.height) * strength}px)`;
  }, [strength]);
  const reset = useCallback(() => { const el = ref.current; if (el) el.style.transform = "translate(0px,0px)"; }, []);
  return <span ref={ref} onMouseMove={handleMove} onMouseLeave={reset} className={`magnetic ${className}`} {...rest}>{children}</span>;
}

function PageTransition({ children }) {
  const { page } = useRoute();
  const [show, setShow] = useState(false);
  useEffect(() => { setShow(false); const t = setTimeout(() => setShow(true), prefersReducedMotion() ? 0 : 30); return () => clearTimeout(t); }, [page]);
  return <div className={`page-transition ${show ? "page-transition-in" : ""}`}>{children}</div>;
}
